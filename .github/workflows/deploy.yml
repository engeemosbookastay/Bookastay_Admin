# Builds the admin on every push to main and publishes the finished files to the
# "deploy" branch of this repo. The cPanel server picks up that branch
# automatically (see deploy/cpanel-sync.sh), so a push is all it takes to go live.
# No secrets needed — only public settings are used below.
name: Build for cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: https://bookastay-backend-zuwa.onrender.com

      - name: Publish build to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
          enable_jekyll: true
          commit_message: "Build of"
