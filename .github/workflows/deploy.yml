# Builds the admin and uploads it to the QServers cPanel hosting on every push
# to main — no manual zips or uploads.
#
# One-time setup in GitHub → this repo → Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER   (e.g. ftp.bookastayng.com)
#              FTP_USERNAME (a cPanel FTP account whose folder is this site's folder)
#              FTP_PASSWORD
#   Variables: VITE_API_URL             (https://bookastay-backend-zuwa.onrender.com)
#              FTP_SERVER_DIR           (optional; folder to upload into, default ./)
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
